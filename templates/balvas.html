<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Balvas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    /* Top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #d0d0d0;
      border-radius: 50px;
      padding: 9px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #222;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #f0f0f0; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr th {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      text-align: left;
      padding: 0 12px 14px 12px;
      border-bottom: 1.5px solid #e8e8e8;
    }
    thead tr th:first-child { padding-left: 0; }
    thead tr th.col-punkti { text-align: left; }
    thead tr th.col-actions { text-align: right; }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
    }
    tbody tr:last-child { border-bottom: none; }

    tbody tr td {
      padding: 18px 12px;
      font-size: 15px;
      color: #222;
      vertical-align: middle;
    }
    tbody tr td:first-child { padding-left: 0; }

    .balva-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #bbb;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .star-btn:hover { color: #f5a623; }
    .star-btn svg { width: 20px; height: 20px; display: block; }

    .balva-name {
      font-weight: 400;
      line-height: 1.35;
    }

    /* Punkti */
    .col-punkti { font-variant-numeric: tabular-nums; }

    /* Delete button */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
    }
    .delete-btn:hover { color: #d00; background: #fff0f0; }
    .delete-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Top bar -->
    <div class="topbar">

      <button class="btn" onclick="window.location.href='{{ url_for('parsk') }}'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/> </svg> Atpakaļ
      </button>
      <button class="btn" onclick="window.location.href='https://lkupelis.pythonanywhere.com/balvas_piev'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12"/>
          <rect x="2" y="7" width="20" height="5"/>
          <line x1="12" y1="22" x2="12" y2="7"/>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
        Pievienot balvu
      </button>
    </div>

    <!-- Table -->
    <table>
      <thead>
        <tr>
          <th>Balva</th>
          <th class="col-punkti">Punkti</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody>
  {% for reward in rewards %}
  <tr>
    <td>
      <div class="balva-cell">
        <button class="star-btn" aria-label="Atzīmēt">
          ⭐
        </button>
        <span class="balva-name">{{ reward.title }}</span>
      </div>
    </td>

    <td class="col-punkti">{{ reward.cost }}</td>

    <td>
      <form method="POST" action="{{ url_for('delete_reward', reward_id=reward.id) }}">
        <button type="submit" class="delete-btn" aria-label="Dzēst">
          🗑
        </button>
      </form>
    </td>
  </tr>
  {% endfor %}
</tbody>
    </table>

  </div>
</body>
</html>
