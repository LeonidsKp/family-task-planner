<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lietotāju saraksts</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 32px;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #d0d0d0;
      border-radius: 50px;
      padding: 9px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #222;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #f0f0f0; }

    .btn .icon {
      font-size: 18px;
      line-height: 1;
      display: inline-block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr th {
      font-size: 13px;
      font-weight: 500;
      color: #8a8a8a;
      text-align: left;
      padding: 0 12px 14px 12px;
      border-bottom: 1.5px solid #e8e8e8;
    }

    thead tr th:first-child { padding-left: 0; }
    thead tr th:last-child { text-align: right; }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
    }
    tbody tr:last-child { border-bottom: none; }

    tbody tr td {
      padding: 18px 12px;
      font-size: 15px;
      font-weight: 400;
      color: #222;
      vertical-align: middle;
    }
    tbody tr td:first-child { padding-left: 0; }
    tbody tr td:last-child { text-align: right; }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #bbb;
      line-height: 1;
      transition: color 0.15s;
    }
    .star-btn:hover { color: #f5a623; }

    .star-icon {
      font-size: 20px;
      line-height: 1;
    }

    .name-text { font-weight: 500; }

    .points-cell { font-variant-numeric: tabular-nums; }

    .action-btn {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .action-btn:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">

    <div class="topbar">
      <button class="btn" onclick="window.location.href='https://lkupelis.pythonanywhere.com/balvas'">
        <span class="icon">🎁</span> Balvas
      </button>

      <button class="btn" onclick="window.location.href='{{ url_for('logout_plan') }}'">
        <span class="icon">🚪</span> Iziet
      </button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Vārds</th>
          <th>Puntu skaits</th>
          <th>Darbības</th>
        </tr>
      </thead>
        <tbody>
        {% for child in children %}
        <tr>
          <td>
            <div class="name-cell">
              <button class="star-btn" aria-label="Atzīmēt">
                <span class="star-icon">☆</span>
              </button>
              <span class="name-text">{{ child.name }}</span>
            </div>
          </td>

          <td class="points-cell">{{ child.points }}</td>

          <td>
            <button class="action-btn"
              onclick="window.location.href='{{ url_for('child_profile_parent', child_id=child.id) }}'">
              Skatīt profilu
            </button>
          </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

  </div>
</body>
</html>
