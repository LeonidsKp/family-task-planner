<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Balvas</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .reward-row {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }

    .reward-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .reward-left {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
    }

    .star-btn.active {
      color: #f5a623;
    }

    .btn-request {
      border: 1px solid #ccc;
      border-radius: 50px;
      padding: 6px 12px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-request:hover {
      background: #f0f0f0;
    }

    .disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- Back -->
  <button class="btn-back" onclick="window.location.href='{{ next_page or url_for('b_profils') }}'">
    ← Atpakaļ
  </button>

  <div class="table-header">
    <span>Balva</span>
    <span>Punkti</span>
  </div>

  {% if rewards %}
            {% for reward in rewards %}
        <div class="reward-row">

          <div class="reward-top">
            <div class="reward-left">
              <span>{{ reward.title }}</span>
            </div>

            <span>{{ reward.cost }}</span>
          </div>

          <!-- TAKE BUTTON -->
          <form method="POST" action="{{ url_for('take_reward') }}">
            <input type="hidden" name="reward_id" value="{{ reward.id }}">
            <input type="hidden" name="next" value="{{ next_page }}">
            <button class="btn-request {% if reward.cost > user_points %}disabled{% endif %}"
                    {% if reward.cost > user_points %}disabled{% endif %}>
              Paņemt balvu
            </button>
          </form>

        </div>
        {% endfor %}
  {% else %}
    <p>Nav pieejamu balvu</p>
  {% endif %}

</div>

</body>
</html>
